<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI224 Quiz</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:15px;font-size:18px}.card{background:white;padding:15px;margin:12px 0;border-radius:10px}.opt{display:block;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;cursor:pointer}.correct{background:#c8f7c5}.wrong{background:#ffc7c7}.msg{font-weight:bold;margin-top:8px}button{font-size:18px;padding:12px;margin:8px;border-radius:8px}</style></head><body><h1>AI224 Quiz</h1><div id="quiz"></div><button onclick="showResult()">Score</button><button onclick="retake()">Retake Wrong Questions</button><button onclick="randomExam()">🎲 Random Exam</button><div id="result"></div><script>let data=[{"id": 1, "q": "In advanced AI systems, Precision measures:", "opts": ["A. Total predictions", "B. Correct positive predictions", "C. Model speed", "D. Correct negative predictions"], "ans": "B"}, {"id": 2, "q": "Which of the following is NOT a type of AI?", "opts": ["A. Relational AI", "B. Artificial Super Intelligence", "C. General AI", "D. Narrow AI"], "ans": "A"}, {"id": 3, "q": "Artificial Intelligence is best defined as:", "opts": ["A. The simulation of human intelligence by machines", "B. A database management system", "C. A programming language", "D. A computer hardware device"], "ans": "A"}, {"id": 4, "q": "Which algorithm is used for regression problems?", "opts": ["A. K-Means", "B. Linear Regression", "C. KNN Classification", "D. Apriori"], "ans": "B"}, {"id": 5, "q": "Which of the following statements is TRUE? K-Means clustering is an example of:", "opts": ["A. Reinforcement Learning", "B. Unsupervised Learning", "C. Deep Learning", "D. Supervised Learning"], "ans": "B"}, {"id": 6, "q": "Reinforcement learning uses:", "opts": ["A. Input-output pairs", "B. Random output only", "C. No data", "D. Reward signal"], "ans": "D"}, {"id": 7, "q": "Accuracy is calculated as:", "opts": ["A. TP / (TP + FP)", "B. (TP + TN) / Total", "C. TP / (TP + FN)", "D. FP / Total"], "ans": "B"}, {"id": 8, "q": "Which function splits data into training and testing sets?", "opts": ["A. fit_transform", "B. train_test_split", "C. compile", "D. predict_proba"], "ans": "B"}, {"id": 9, "q": "NumPy arrays are primarily used for:", "opts": ["A. Game design", "B. Numerical computations", "C. Web development", "D. Networking"], "ans": "B"}, {"id": 10, "q": "Which technique helps prevent overfitting?", "opts": ["A. Increasing noise", "B. Removing validation set", "C. Ignoring loss", "D. Regularization"], "ans": "D"}, {"id": 11, "q": "Deep learning models typically require:", "opts": ["A. Only structured data", "B. No data", "C. Very small datasets", "D. Large datasets"], "ans": "D"}, {"id": 12, "q": "The purpose of backpropagation is to:", "opts": ["A. Initialize weights randomly", "B. Update weights using gradients", "C. Shuffle dataset", "D. Normalize input data"], "ans": "B"}, {"id": 13, "q": "Which loss function is commonly used for classification?", "opts": ["A. Mean Absolute Error", "B. Cross-Entropy", "C. Huber Loss only", "D. Hinge Loss only"], "ans": "B"}, {"id": 14, "q": "Vanishing gradient problem mainly occurs in:", "opts": ["A. Naive Bayes", "B. Decision trees", "C. Deep networks", "D. KNN"], "ans": "C"}, {"id": 15, "q": "Feedforward neural network:", "opts": ["A. Has loops", "B. Has no feedback", "C. Is circular", "D. Is random"], "ans": "B"}, {"id": 16, "q": "A neuron fires when:", "opts": ["A. Input is zero", "B. Sum exceeds threshold", "C. Weight is zero", "D. Output is zero"], "ans": "B"}, {"id": 17, "q": "ANN can handle:", "opts": ["A. Only clean data", "B. Noisy and incomplete data", "C. No data", "D. Only numbers"], "ans": "B"}, {"id": 18, "q": "The basic unit of the human brain is:", "opts": ["A. Axon", "B. Synapse", "C. Neuron", "D. Dendrite"], "ans": "C"}, {"id": 19, "q": "Knowledge in ANN is stored in:", "opts": ["A. Files", "B. CPU", "C. Weights", "D. RAM"], "ans": "C"}, {"id": 20, "q": "ANN processes information:", "opts": ["A. Sequentially only", "B. Parallelly", "C. Manually", "D. Randomly"], "ans": "B"}, {"id": 21, "q": "Pooling layer reduces:", "opts": ["A. Dataset size", "B. Number of classes", "C. Learning rate", "D. Spatial dimensions"], "ans": "D"}, {"id": 22, "q": "Convolution operation is mainly used for:", "opts": ["A. Data compression", "B. Feature extraction", "C. Sorting pixels", "D. Data encryption"], "ans": "B"}, {"id": 23, "q": "If input image is 6x6 and filter is 3x3 with stride 1 and no padding, output size is:", "opts": ["A. 3x3", "B. 5x5", "C. 6x6", "D. 4x4"], "ans": "D"}, {"id": 24, "q": "Which Python library is used for tensor operations?", "opts": ["A. PyTorch", "B. Flask", "C. Django", "D. Tkinter"], "ans": "A"}, {"id": 25, "q": "in convolution operation , number of channel must be the same in …...............", "opts": ["A. none of them", "B. input and output", "C. both of them", "D. input and filter"], "ans": "D"}, {"id": 26, "q": "Differences among networks output and the probable outcome are calculated using _____________?", "opts": ["A. none of them", "B. positive function", "C. loss function", "D. negative function"], "ans": "C"}, {"id": 27, "q": "What is the \"Training, or learning, algorithm\" responsible for in an ANN?", "opts": ["A. Defining the network's structure", "B. Processing the input data", "C. Selecting the activation function", "D. Determining the weights on the connections"], "ans": "D"}, {"id": 28, "q": "What is a defining characteristic of a Multi-Layer Neural Network?", "opts": ["A. It has one or more hidden layers between the input and output layers.", "B. It only uses recurrent connections.", "C. It has no hidden layers.", "D. It has only input and output layers."], "ans": "A"}, {"id": 29, "q": "Which neural network model is associated with Supervised Learning?", "opts": ["A. Clustering", "B. Self-organizing maps (SOM)", "C. Perceptron", "D. Hopfield"], "ans": "C"}, {"id": 30, "q": "An e-commerce platform uses a neural network to group customers based on their purchasing behavior, browsing history, and demographic data for targeted marketing. What problem is being solved, and what is the key challenge in ensuring the effectiveness of this approach?", "opts": ["A. Classification; assigning customers to predefined market segments.", "B. Function Approximation; modeling the complex relationship between customer attributes and purchase patterns.", "C. Clustering; discovering natural groupings of customers based on their behavior.", "D. Regression; predicting the likelihood of a customer making a purchase."], "ans": "C"}, {"id": 32, "q": "According to the definition provided (\"Fuzzy - 'not clear, distinct, or precise; blurred'\"), the concept of \"Fuzzy\" in Fuzzy Logic is primarily concerned with handling notions that lack:", "opts": ["A. Clarity or precision", "B. Context", "C. Complexity", "D. Ambiguity"], "ans": "A"}, {"id": 33, "q": "how suitable are traditional optimization approaches for parallel computing?", "opts": ["A. The approach may not be suitable.", "B. They are highly suitable.", "C. They are always the best choice for parallel computing.", "D. They are moderately suitable."], "ans": "A"}, {"id": 34, "q": "what is a main property that makes arrays of bits convenient for genetic representations?", "opts": ["A. Their parts are easily aligned due to their fixed size.", "B. They are easy to compress.", "C. They are computationally efficient.", "D. They can represent any type of data."], "ans": "A"}, {"id": 35, "q": "when does the mutation operator typically occur in a Genetic Algorithm?", "opts": ["A. After selection and crossover, on the new population.", "B. Before the initial population is created.", "C. Before selection.", "D. During crossover."], "ans": "A"}, {"id": 36, "q": "Which of the following is a characteristic of Soft Computing?", "opts": ["A. It does not require any mathematical modeling of problem-solving.", "B. Its algorithms are static.", "C. It always yields the precise solution.", "D. It requires precise mathematical modeling."], "ans": "A"}, {"id": 37, "q": "The random mutation of offspring in Genetic Algorithms serves to:", "opts": ["A. Reduce the computational load by decreasing the population size.", "B. Simplify the fitness evaluation process.", "C. Guarantee the convergence of the algorithm to the optimal solution.", "D. Introduce new genetic material and prevent the population from becoming too homogeneous."], "ans": "D"}, {"id": 38, "q": "What type of solution does Soft Computing typically yield?", "opts": ["A. Always precise solutions.", "B. Approximate or imprecise solutions.", "C. Only analytical solutions.", "D. Only binary solutions."], "ans": "B"}, {"id": 39, "q": "Without a fitness function, a Genetic Algorithm would:", "opts": ["A. Not be able to evaluate the solutions.", "B. Not be able to create a genetic representation.", "C. Not be able to apply mutation and crossover.", "D. Not be able to generate a population."], "ans": "A"}, {"id": 40, "q": "What does \"Convergence\" refer to in the context of GA operators?", "opts": ["A. The way solutions are represented in the GA.", "B. The method for introducing diversity in the next generation.", "C. The criterion used to decide when to terminate the algorithm.", "D. The process of combining two parent solutions."], "ans": "C"}, {"id": 41, "q": "How is the evolutionary process organized in a Genetic Algorithm?", "opts": ["A. In generations", "B. In parallel threads", "C. In a continuous stream", "D. In discrete steps"], "ans": "A"}, {"id": 42, "q": "Which biological behavior inspires Genetic Algorithms (GA)?", "opts": ["A. Human nervous system.", "B. Genetics and Evolution.", "C. Annealing process.", "D. Behavior of an ant colony."], "ans": "B"}, {"id": 43, "q": "A programming paradigm is:", "opts": ["A. A hardware device", "B. A way to classify programming languages", "C. A compiler", "D. A database"], "ans": "B"}, {"id": 44, "q": "Structured programming focuses on:", "opts": ["A. Random jumps", "B. Code clarity and loops", "C. Machine code", "D. Assembly only"], "ans": "B"}, {"id": 45, "q": "Event-driven programming depends on:", "opts": ["A. CPU speed", "B. Events like clicks", "C. Memory size", "D. Variables"], "ans": "B"}, {"id": 46, "q": "Multithreading means:", "opts": ["A. Multiple tasks in one process", "B. Multiple programs", "C. Multiple variables", "D. Multiple CPUs"], "ans": "A"}, {"id": 47, "q": "Which expression is valid?", "opts": ["A. 2 +", "B. y + 6", "C. if x", "D. loop"], "ans": "B"}, {"id": 48, "q": "continue statement:", "opts": ["A. Ends loop", "B. Restarts program", "C. Deletes variable", "D. Skips current iteration"], "ans": "D"}, {"id": 49, "q": "Infinite loop occurs when:", "opts": ["A. Loop ends quickly", "B. Syntax error", "C. Condition never becomes false", "D. Compiler fails"], "ans": "C"}, {"id": 50, "q": "Colon (:) in Python, is used to:", "opts": ["A. Start block", "B. Print output", "C. Define variable", "D. End program"], "ans": "A"}, {"id": 51, "q": "Interpreted languages:", "opts": ["A. Compile first", "B. Execute line by line", "C. Cannot run", "D. Are hardware"], "ans": "B"}, {"id": 52, "q": "Garbage collection is:", "opts": ["A. Error handling", "B. Memory management", "C. Loop execution", "D. Debugging"], "ans": "B"}, {"id": 53, "q": "In Python, comments start with:", "opts": ["A. //", "B. #", "C. **", "D. <!-"], "ans": "B"}, {"id": 54, "q": "OOP is based on:", "opts": ["A. Numbers", "B. Objects", "C. String", "D. Files"], "ans": "B"}, {"id": 55, "q": "What does kwargs ** store?", "opts": ["A. List", "B. Dictionary", "C. Tuple", "D. String"], "ans": "B"}, {"id": 56, "q": "Lambda function can contain:", "opts": ["A. Classes", "B. Multiple statements", "C. Loops", "D. One expression only"], "ans": "D"}, {"id": 57, "q": "OOP focuses on:", "opts": ["A. Variables", "B. Loops", "C. Objects", "D. Functions"], "ans": "C"}, {"id": 58, "q": "Instance method:", "opts": ["A. Global", "B. Outside class", "C. Static only", "D. Inside class"], "ans": "D"}, {"id": 59, "q": "Inheritance means:", "opts": ["A. Class gets properties of another class", "B. Looping", "C. Copying variables", "D. Printing"], "ans": "A"}, {"id": 60, "q": "Garbage collection handles:", "opts": ["A. Output", "B. Input", "C. Memory management", "D. Loop"], "ans": "C"}, {"id": 61, "q": "Which keyword defines a function in Python?", "opts": ["A. func", "B. function", "C. define", "D. def"], "ans": "D"}, {"id": 62, "q": "What is a lambda in Python?", "opts": ["A. A file object", "B. A loop", "C. A small anonymous function", "D. An exception type"], "ans": "C"}, {"id": 63, "q": "What is recursion?", "opts": ["A. Loop", "B. Condition", "C. Variable", "D. Function calling itself"], "ans": "D"}, {"id": 64, "q": "Child class can:", "opts": ["A. Ignore class", "B. Override methods", "C. Delete parent", "D. Only inherit"], "ans": "B"}, {"id": 65, "q": "x is y checks:", "opts": ["A. Value equality", "B. Length", "C. Memory reference", "D. Type"], "ans": "C"}, {"id": 66, "q": "What does the WORA principle mean for Java?", "opts": ["A. It requires recompilation for different platforms.", "B. It is only used for web development.", "C. It can only run on specific platforms.", "D. It can run on any platform that supports it without recompilation."], "ans": "D"}, {"id": 67, "q": "why is Python a favorite programming language among developers in AI development?", "opts": ["A. Its syntax simplicity and versatility.", "B. Its strong typing and strict structure.", "C. Its long history and extensive legacy code.", "D. Its execution speed and low-level control."], "ans": "A"}, {"id": 68, "q": "What is the output of print(\"5\" + \"2\")", "opts": ["A. 52", "B. 7", "C. Error", "D. 10"], "ans": "A"}, {"id": 69, "q": "What is the output of: for i in range(3): print(i)", "opts": ["A. 0 1 2", "B. 0 1 2 3", "C. 1 2 3", "D. error"], "ans": "A"}, {"id": 70, "q": "What is the output of: i=0 while i < 3: i += 1 if i == 2: continue print(i)", "opts": ["A. 1 2 3", "B. Error", "C. 1 3", "D. 2 3"], "ans": "C"}, {"id": 71, "q": "What is the output of: x=5 print(x == 5)", "opts": ["A. True", "B. False", "C. 5", "D. Error"], "ans": "A"}, {"id": 72, "q": "The training algorithm in ANN is responsible for:", "opts": ["A. Defining network structure", "B. Processing input data", "C. Selecting activation function", "D. Determining the weights on the connections"], "ans": "D"}, {"id": 73, "q": "Which biological behavior inspires Genetic Algorithms (GA)?", "opts": ["A. Human nervous system", "B. Genetics and Evolution", "C. Annealing process", "D. Behavior of an ant colony"], "ans": "B"}, {"id": 74, "q": "Soft Computing mainly deals with:", "opts": ["A. Exact solutions only", "B. Uncertainty and imprecision", "C. Hardware design", "D. Binary processing only"], "ans": "B"}, {"id": 75, "q": "Genetic Algorithms are inspired by:", "opts": ["A. Natural selection", "B. Database systems", "C. Operating systems", "D. Computer networks"], "ans": "A"}, {"id": 76, "q": "Fuzzy Logic differs from classical logic because it:", "opts": ["A. Uses only true/false values", "B. Allows degrees of truth", "C. Rejects uncertainty", "D. Uses only numbers"], "ans": "B"}, {"id": 77, "q": "A neural network learns mainly by adjusting:", "opts": ["A. Files", "B. Weights", "C. Programs", "D. Variables"], "ans": "B"}, {"id": 78, "q": "Supervised learning requires:", "opts": ["A. Labeled data", "B. No data", "C. Random data only", "D. Unlabeled clusters"], "ans": "A"}, {"id": 79, "q": "Unsupervised learning aims to:", "opts": ["A. Find hidden patterns in data", "B. Use predefined labels", "C. Predict only numbers", "D. Replace hardware"], "ans": "A"}];let wrong=[];let done={};function render(){let h='';data.forEach((x,i)=>{h+=`<div class="card" id="q${i}"><b>Q${x.id}. ${x.q}</b>`;x.opts.forEach((o,j)=>{let l=String.fromCharCode(65+j);h+=`<label class="opt"><input type="radio" name="q${i}" onclick="check(${i},'${l}')"> ${o}</label>`});h+='<div class="msg"></div></div>'});document.getElementById('quiz').innerHTML=h;wrong=[];done={}}function check(i,a){if(done[i])return;done[i]=1;let c=document.querySelectorAll('#q'+i+' .opt');let msg=document.querySelector('#q'+i+' .msg');let ok=a==data[i].ans;c[a.charCodeAt(0)-65].classList.add(ok?'correct':'wrong');c[data[i].ans.charCodeAt(0)-65].classList.add('correct');if(!ok)wrong.push(i);msg.textContent=ok?'Correct':'Correct answer: '+data[i].ans}function showResult(){let score=0;Object.keys(done).forEach(i=>{if(document.querySelector('#q'+i+' .correct'))score++});let h='<h2>Score: '+score+'/'+data.length+'</h2>';h+='<h3>Wrong Answers Review</h3>';wrong.forEach(i=>{h+=`<p>Q${data[i].id}: ${data[i].q}<br>Your answer: wrong<br>Correct: ${data[i].ans}</p>`});document.getElementById('result').innerHTML=h}function retake(){data=data.filter((x,i)=>wrong.includes(i));render()}function randomExam(){data.sort(()=>Math.random()-.5);data.forEach(x=>{let old=x.opts.map((o,i)=>({o,a:String.fromCharCode(65+i)}));old.sort(()=>Math.random()-.5);let ans=old.findIndex(z=>z.a==x.ans);x.opts=old.map(z=>z.o);x.ans=String.fromCharCode(65+ans)});render()}render();</script></body></html>
